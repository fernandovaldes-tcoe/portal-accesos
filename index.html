<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Seguro - NTT Data</title>
    <!-- Cargamos la librería matemática de cifrado -->
        <!-- Cargamos la librería matemática de cifrado -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { margin-top: 0; color: #0056b3; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #004494; }
        #resultado { margin-top: 20px; padding: 15px; border-radius: 5px; font-weight: bold; font-size: 20px; font-family: monospace; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .disclaimer { color: #666; font-size: 13px; margin-bottom: 25px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔓 Revelar Acceso Seguro</h2>
    <p class="disclaimer">Todo el procesamiento es local mediante AES-256. Ningún dato que ingreses aquí viaja por internet.</p>
    
    <div class="input-group">
        <label>Bloque de Acceso Cifrado (Pégalo del correo):</label>
        <input type="text" id="textoCifrado" placeholder="U2FsdGVkX1...">
    </div>

    <div class="input-group">
        <label>Tu Correo de Consultoría (Ej: tu.nombre@consultoria.com):</label>
        <input type="email" id="correoUser" placeholder="usuario@empresa.com">
    </div>
    
    <div class="input-group">
        <label>Tu Número de Empleado (PIN):</label>
        <input type="password" id="numEmpleado" placeholder="Ingresa tu número">
    </div>
    
    <button onclick="descifrar()">Descifrar Contraseña</button>
    
    <div id="resultado"></div>
</div>

<script>
    function descifrar() {
        const textoCifrado = document.getElementById('textoCifrado').value.trim();
        const correoUser = document.getElementById('correoUser').value.trim().toLowerCase();
        const numEmpleado = document.getElementById('numEmpleado').value.trim();
        
        if(!textoCifrado || !correoUser || !numEmpleado) {
            mostrarMensaje("Por favor llena todos los campos.", false);
            return;
        }

        try {
            // Recreamos la llave maestra exacta: Número + Prefix del correo
            const prefijoCorreo = correoUser.split('@')[0];
            const llaveMaestra = numEmpleado + prefijoCorreo;

            // Intentamos descifrar
            const bytes  = CryptoJS.AES.decrypt(textoCifrado, llaveMaestra);
            const textoOriginal = bytes.toString(CryptoJS.enc.Utf8);
            
            if (textoOriginal) {
                mostrarMensaje(textoOriginal, true);
            } else {
                mostrarMensaje("Credenciales incorrectas.", false);
            }
        } catch (e) {
            mostrarMensaje("El bloque de texto cifrado es inválido.", false);
        }
    }

    function mostrarMensaje(mensaje, esExito) {
        const div = document.getElementById('resultado');
        div.style.display = "block";
        div.innerText = mensaje;
        if(esExito) {
            div.className = "success";
        } else {
            div.className = "error";
        }
    }
</script>

</body>
</html>
